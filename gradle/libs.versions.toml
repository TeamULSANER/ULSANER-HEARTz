# Heartz 추가 (확인일 2026-11-09, 근거: .docs/SETUP-RESULTS.md "Heartz M0")
# - NaviHelper 3.0.5 / FusedLocation 1.1.3: 각 SDK 가이드 기준 버전 = Maven release 값
# - Media3 1.9.4: AAR minCompileSdk=35, minSdk 23, kotlin-stdlib 2.0.20 → AGP 8.8.2·compileSdk 35·Kotlin 2.0.0과 호환
# - kotlinx-serialization 1.7.3: Kotlin 2.0.x로 빌드된 마지막 계열(플러그인은 Kotlin 버전과 동일)
# Heartz 추가 (확인일 2026-11-09)
# - TextToSpeech 3.3.1 / SpeechToText 3.3.1: SDK 릴리스 노트(2026-10-19)·각 intro 가이드 기준 버전 = Maven release 값.
#   AAR minSdk 23, 요구 CAAS(ai.pleos.playground.caas) >= 4.1.29 — AVD 4.2.10 확인
[versions]
agp = "8.8.2"
kotlin = "2.0.0"
coreKtx = "1.16.0"
lifecycle = "2.9.0"
activityCompose = "1.10.1"
composeBom = "2024.04.01"
kotlinxCoroutines = "1.9.0"
vehicleSdk = "2.3.2"
naviHelperSdk = "3.0.5"
fusedLocationSdk = "1.1.3"
ttsSdk = "3.3.1"
sttSdk = "3.3.1"
media3 = "1.9.4"
kotlinxSerialization = "1.7.3"
junit = "4.13.2"
androidxJunit = "1.2.1"
espressoCore = "3.6.1"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
vehicle-sdk = { module = "ai.pleos.playground:Vehicle", version.ref = "vehicleSdk" }
navihelper-sdk = { module = "ai.pleos.playground:NaviHelper", version.ref = "naviHelperSdk" }
fusedlocation-sdk = { module = "ai.pleos.playground:FusedLocation", version.ref = "fusedLocationSdk" }
tts-sdk = { module = "ai.pleos.playground:TextToSpeech", version.ref = "ttsSdk" }
stt-sdk = { module = "ai.pleos.playground:SpeechToText", version.ref = "sttSdk" }
media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
